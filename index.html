<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Biblioteka Online</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    background:#f5f5f5;
}


/* HEADER */

header { 
    background:#2b3a67; 
    color:white; 
    padding:10px 20px; 
    display:flex; 
    flex-direction:column; 
    align-items:center; 
    justify-content:center; 
    position:relative; 
}


header h1 { 
    margin:0; 
    font-size:24px; 
    text-align:center; 
}


#searchBox { 
    margin-top:10px; 
    padding:7px 12px; 
    border-radius:5px; 
    border:none; 
    width:90%; 
    max-width:400px; 
    font-size:14px; 
}


.bookTitle,
.bookAuthor,
.bookYear {
    font-weight:bold;
}


/* BURGER */

#burger { 
    font-size:28px; 
    cursor:pointer; 
    position:absolute; 
    left:25px; 
    top:15px; 
    color:white; 
}



/* MENU */

nav { 
    display:none; 
    background:white; 
    padding:10px; 
    position:fixed; 
    top:0; 
    left:0; 
    width:250px; 
    height:100%; 
    box-shadow:2px 0 6px rgba(0,0,0,0.2); 
    z-index:15; 
    border-radius:0 10px 10px 0; 
    overflow-y:auto;
}


#closeNav { 
    text-align:right;
    font-size:25px;
    cursor:pointer;
    display:block;
}


nav ul { 
    list-style:none; 
    padding:0;
    margin-top:30px;
}


nav ul li { 
    padding:12px 10px; 
    border-bottom:1px solid #ccc; 
    cursor:pointer; 
    font-weight:bold; 
}


nav ul li:hover {
    background:#eee;
}



/* LIBRAT */

#booksContainer { 
    max-width:1000px; 
    margin:20px auto; 
    display:grid; 
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); 
    gap:15px; 
    padding:0 10px; 
}



.bookCard { 

    background:white; 
    padding:10px; 
    border-radius:10px; 
    box-shadow:0 2px 6px rgba(0,0,0,0.2); 
    text-align:center; 
    display:flex; 
    flex-direction:column; 
    align-items:center; 
    cursor:pointer; 
    border:2px solid #2b3a67; 
    transition:0.2s;

}



.bookCard:hover { 
    transform:translateY(-3px);
}



.bookCard img { 
    width:140px; 
    height:180px; 
    object-fit:cover; 
    border-radius:5px; 
}



.bookCard h3 { 
    margin:10px 0 6px; 
    font-size:16px; 
}



.bookCard p { 
    font-size:13px; 
    margin:4px 0; 
}



.bookCard a {

    display:inline-block;
    margin-top:8px;
    padding:7px 12px;
    background:#2b3a67;
    color:white;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;

}



/* MODAL */

#bookModal {

    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:100;
    padding:10px;

}



#bookModalContent {

    background:white;
    padding:20px;
    border-radius:10px;
    max-width:400px;
    width:100%;
    max-height:90%;
    overflow-y:auto;

}



#bookModalContent img {

    width:100%;
    border-radius:5px;

}



#closeModal {

    cursor:pointer;
    float:right;
    font-size:22px;
    font-weight:bold;

}



/* MOBILE */

@media(max-width:500px){

#booksContainer{

grid-template-columns:repeat(2,1fr);
gap:10px;

}


.bookCard img{

width:110px;
height:150px;

}


.bookCard h3{

font-size:13px;

}


.bookCard p{

font-size:11px;

}


.bookCard a{

font-size:11px;

}

}


</style>

</head>


<body>


<header>

<div id="burger">&#9776;</div>

<h1>Biblioteka Online</h1>

<input 
type="text" 
id="searchBox" 
placeholder="Kërko libër ose autor..."
>

</header>



<nav id="navMenu">

<span id="closeNav">✖</span>


<ul id="categoryMenu">

<li class="categoryItem" data-category="">
Të gjitha
</li>


<li id="cPanelLink">
C Panel
</li>


</ul>


</nav>




<div id="booksContainer"></div>



<!-- MODAL -->

<div id="bookModal">


<div id="bookModalContent">


<span id="closeModal">
✖
</span>


<div id="modalContent"></div>


</div>


</div>

<script type="module">

import { 
initializeApp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getFirestore,
collection,
getDocs,
query,
where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



// FIREBASE CONFIG

const firebaseConfig = {

apiKey: "AIzaSyBrH_LPGz-66c9s9LYqmnyjCEX1yUGt3BA",

authDomain: "bibliotekaapp-2f2b5.firebaseapp.com",

projectId: "bibliotekaapp-2f2b5",

storageBucket: "bibliotekaapp-2f2b5.appspot.com",

messagingSenderId: "1056004303783",

appId: "1:1056004303783:web:335725cdfeefc690702482",

measurementId: "G-QHEGWD5J2B"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



// ELEMENTET

const booksContainer =
document.getElementById("booksContainer");


const categoryMenu =
document.getElementById("categoryMenu");


const navMenu =
document.getElementById("navMenu");


const burger =
document.getElementById("burger");


const closeNav =
document.getElementById("closeNav");


const searchBox =
document.getElementById("searchBox");


const cPanelLink =
document.getElementById("cPanelLink");



const bookModal =
document.getElementById("bookModal");


const modalContent =
document.getElementById("modalContent");


const closeModal =
document.getElementById("closeModal");




// HAP MENU

burger.onclick = () => {

navMenu.style.display="block";

};



closeNav.onclick = () => {

navMenu.style.display="none";

};




// PANEL

cPanelLink.onclick = () => {

window.location.href="panel.html";

};





// ===============================
// NGARKO KATEGORITE
// ===============================


async function loadCategories(){


const snapshot =
await getDocs(collection(db,"categories"));



snapshot.forEach(doc=>{


const data = doc.data();


const li =
document.createElement("li");


li.className="categoryItem";


li.textContent=data.name;


li.dataset.category=data.name;



li.onclick=()=>{


loadBooks(data.name, searchBox.value);


navMenu.style.display="none";


};



categoryMenu.insertBefore(li,cPanelLink);



});


}



 // ===============================
// NGARKO LIBRAT
// ===============================



async function loadBooks(category=null, searchText=""){



booksContainer.innerHTML="";


let booksQuery;



if(category){


booksQuery =
query(
collection(db,"books"),
where("category","==",category)
);


}

else{


booksQuery =
collection(db,"books");


}



const snapshot =
await getDocs(booksQuery);



if(snapshot.empty){


booksContainer.innerHTML=
"<h3 style='text-align:center'>Nuk ka libra</h3>";

return;


}



snapshot.forEach(doc=>{



const data = doc.data();



const title =
data.title || "Pa titull";


const author =
data.author || "Pa autor";


const year =
data.year || "";


const image =
data.imageUrl || "https://via.placeholder.com/150";


const pdf =
data.pdfUrl || "#";




if(searchText){


const text =
searchText.toLowerCase();



if(
!title.toLowerCase().includes(text)
&&
!author.toLowerCase().includes(text)

)

return;


}




const div =
document.createElement("div");


div.className="bookCard";



div.innerHTML=`

<img src="${image}" alt="${title}">


<h3 class="bookTitle">
${title}
</h3>


<p>
<strong>Autor:</strong>
<span class="bookAuthor">
${author}
</span>
</p>


<p>
<strong>Viti:</strong>
<span class="bookYear">
${year}
</span>
</p>



<a href="${pdf}" 
   target="_blank"
   onclick="event.stopPropagation();">
📥 Shkarko PDF
</a>


`;




div.onclick=(e)=>{


if(!e.target.closest("a")) {
    showBookModal(data);
}


};



booksContainer.appendChild(div);



});



}







// ===============================
// MODAL
// ===============================


function showBookModal(book){


modalContent.innerHTML=`

<h2>
${book.title || ""}
</h2>


<p>
<strong>Autor:</strong>
${book.author || ""}
</p>


<p>
<strong>Viti:</strong>
${book.year || ""}
</p>



<img src="${book.imageUrl || ""}">


<p>
${book.description || ""}
</p>



<a href="${book.pdfUrl}" 
   target="_self"
   onclick="event.stopPropagation();">
📥 Shkarko PDF
</a>

`;



bookModal.style.display="flex";


}




closeModal.onclick=()=>{


bookModal.style.display="none";


};





// ===============================
// KERKIMI
// ===============================


searchBox.addEventListener(
"input",
()=>{

loadBooks(null,searchBox.value);

}

);





// START

loadCategories();

loadBooks();



</script>


</body>

</html>
